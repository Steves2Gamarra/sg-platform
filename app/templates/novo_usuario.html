{% extends "base.html" %}
{% block content %}

<section class="container">

    <h1>Novo Usuário</h1>

    <p class="page-description">

        Cadastre um novo usuário na SG Platform.

    </p>

    <div class="card-form">

        <div class="card-header">

            <h2>

                Dados do usuário

            </h2>

            <p>

                Preencha os dados para cadastrar um novo usuário.

            </p>

        </div>

        <form method="POST">

            <div class="form-group">

                <label for="nome">

                    Nome

                </label>

                <input

                    type="text"
                    id="nome"
                    name="nome"
                    required

                >
            </div>

            <div class="form-group">

                <label for="email">

                    E-mail

                </label>

                <input

                    type="email"
                    id="email"
                    name="email"
                    required

                >

            </div>

            <div class="form-group">

                <label for="senha">

                    Senha

                </label>

                <input

                    type="password"
                    id="senha"
                    name="senha"
                    required

                >

            </div>

            <div class="form-group">

                <label for="perfil">

                    Perfil

                </label>

                <select

                    id="perfil"
                    name="perfil"
                    required

                >

                    <option value="admin">

                        Administrador

                    </option>

                    <option value="tecnico">

                        Técnico

                    </option>

                    <option value="usuario">

                        Usuário

                    </option>
            
                 </select>

            </div>

            <div class="form-group">

                <label>

                    <input

                        type="checkbox"
                        name="ativo"
                        checked
                    >

                    Usuário ativo


                </label>

            </div>

            <div class="form-actions">

                <button

                    type="submit"
                    class="btn btn-primary"

                >

                    Cadastrar            
            
                </button>

                 <a

                    href="{{ url_for('usuarios.usuarios') }}"
                    class="btn btn-secondary"

                >

                    Cancelar
        
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
