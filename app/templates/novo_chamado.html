{% extends "base.html" %}

{% block content %}

<section class="container">

    <h1 class="page-title">

        {{ titulo_pagina }}

    </h1>

    <p class="page-description">

        Abra uma solicitação para a equipe de TI preenchendo as informações abaixo.

    </p>

    <div class="card-form">

        <div class="card-header">

            <h2>

                Informações Gerais

            </h2>

            <p>

                Preencha os dados básicos do chamado.

            </p>

        </div>        

    <form
            
        method="POST"
        
        action="{% if chamado %}

                {{ url_for('salvar_edicao', id=chamado.numero[3:]|int) }}{% else %}{{ url_for('novo_chamado') }}{% endif %}">

            <div class="form-grid">

                <div class="form-group full-width">

                    <label for="titulo">Título</label>

                    <input

                        type="text"
                        id="titulo"
                        name="titulo"
                        value="{{ chamado.titulo if chamado else '' }}"
                        placeholder="Ex.: Não consigo acessar o Outlook"

                        >
                </div>

            <div class="form-group">

                <label for="categoria">Categoria</label>

                <select id="categoria" name="categoria">

                    <option {% if chamado and chamado.categoria == "Hardware" %}selected{% endif %}>

                        Hardware

                    </option>

                    <option {% if chamado and chamado.categoria == "Software" %}selected{% endif %}>

                        Software

                    </option>

                    <option {% if chamado and chamado.categoria == "Rede" %}selected{% endif %}>

                        Rede

                    </option>

                    <option {% if chamado and chamado.categoria == "E-Mail" %}selected{% endif %}>
                        
                        E-Mail

                    </option>

                </select>

            </div>

            <div class="form-group">

                <label for="equipamento">Equipamento</label>

                <input

                    type="text"
                    id="equipamento"
                    name="equipamento"
                    value="{{ chamado.equipamento if chamado else ''}}"

                >

            </div>

            <div class="form-group full-width">

                <label for="descricao">Descrição</label>

                <textarea
                
                id="descricao"
                name="descricao"
                rows="7"
                >{{ chamado.descricao if chamado else '' }}</textarea>                            
                
            </div>

        </div>
           
        <div class="form-actions">

            <a 

                href="{{ url_for('chamados') }}"
                class="btn">

                Cancelar

            </a>

            <button
            
                class="btn btn-primary"
                type="submit">

                {{ texto_botao }}

            </button>

        </div>
    
    </form>

    </div>    

</section>

{% endblock %}
