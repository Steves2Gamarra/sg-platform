{% extends "base.html" %}

{% block content %}

<section class="container">

    <div class="card-form">

        <div class="card-header">

            <h1>Login</h1>

            <p>
                Acesse a SG Platform.
            </p>

        </div>

        <form method="POST">

            <div class="form-group">

                <label for="email">E-Mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    required
                >

            </div>

            <div class="form-group">

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Sua senha"
                    required
                >

            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary">

                    Entrar

                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
