<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
        content="width=device-width, initial-scale=1.0">
    <title>SG Platform</title>
    <link rel="stylesheet" 
        href="{{ url_for('static', filename='css/style.css') }}">
        
</head>
<body>
    <header>

    <div class="container header-content">

        <h1 class="logo">

            <a href="{{ url_for('chamados.home') }}">
                SG Platform
            </a>

        </h1>

        <nav class="navbar">

            <a href="{{ url_for('chamados.home') }}">

                🏠 Início

            </a>

            <a href="{{ url_for('chamados.chamados') }}">

                🎫 Chamados

            </a>

            <a href="#">

                💻 Inventário

            </a>

            <a href="{{ url_for('usuarios.usuarios') }}">

                👥 Usuários

            </a>

            <a href="#">

                📊 Relatórios

            </a>

            <a href="#">

                💰 Financeiro

            </a>         

        </nav>

        <div class="user-menu">

            {% if session.get("usuario_id") %}

                <span>

                    👤{{ session.get("usuario_nome") }}

                </span>

                <span>

                    {{ session.get("usuario_perfil") }}

                </span>

                <a href="{{ url_for('auth.logout') }}" class="btn btn-secondary">

                    Sair

                </a>

            {% endif %}
                   
        </div>

          

    </div>

</header>

    {% block content %}

    {% endblock %}

    <footer>
        <p>© 2026 SG Platform</p>
    </footer>
</body>
</html>
